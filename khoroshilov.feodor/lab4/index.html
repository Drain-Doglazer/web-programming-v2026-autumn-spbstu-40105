<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Путешествия</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <h1>Путешествия</h1>

      <form data-testid="entity-form" id="travel-form">
        <div class="form-group">
          <label for="input-id">ID</label>
          <input type="number" id="input-id" name="id" required min="1" />
        </div>
        <div class="form-group">
          <label for="input-name">Имя путешественника</label>
          <input type="text" id="input-name" name="travelerName" required />
        </div>
        <div class="form-group">
          <label for="input-country">Страна</label>
          <input
            type="text"
            id="input-country"
            name="visitedCountries"
            placeholder="Например: Франция"
          />
        </div>
        <button type="submit">Добавить путешествие</button>
      </form>

      <div data-testid="entity-list" id="entity-list" class="entity-list"></div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
